<body><div class="mobile-top"><button id="menu-toggle" aria-expanded="false">☰ 目录</button><button id="filter-toggle" aria-expanded="false">筛选</button></div><button id="drawer-shade" hidden aria-label="关闭目录"></button><aside><div class="brand"><b>∫</b><div><strong>数二练习本</strong><small>按知识点，逐题掌握</small></div></div><nav id="banks" aria-label="题库分区"><button data-bank="exam">真题（示例）</button><button data-bank="lilin880">分册（示例）</button></nav><div id="overview"></div><nav id="views" aria-label="题集"><button data-view="all">全部题目</button><button data-view="favorite">我的收藏</button><button data-view="wrong">错题回顾</button></nav><div class="section-label">知识点目录 <small>已练 / 总数</small></div><nav id="tree" aria-label="知识点分类"></nav><footer><button id="backup" disabled data-boot-disabled>备份与恢复</button><p id="version"></p><p>记录先保存在本机，再同步云端<br>请定期导出备份</p></footer></aside>
<main><div id="startup-panel" role="status"><p id="startup-message">正在加载练习本… 请通过浏览器中的网站地址访问，下载的 HTML 文件不能用于登录做题。</p><button id="startup-retry" hidden>重新尝试</button></div><div class="cloud-toolbar"><button id="offline-status" disabled data-boot-disabled>离线准备中</button><button id="sync-status" disabled data-boot-disabled>等待同步</button><button id="account" disabled data-boot-disabled>重新登录</button><button id="logout" disabled data-boot-disabled>退出登录</button><button id="update-app" hidden>新版本已下载，点击切换</button></div><header><div><div id="breadcrumb">全部题目</div><h1>分类练习</h1></div><button id="resume" disabled data-boot-disabled>继续上次练习</button></header><div id="notice" class="notice" role="status"></div><section class="filters" aria-label="筛选"><label id="year-label">年份<select id="year" disabled data-boot-disabled><option value="">全部年份</option></select></label><label>题型<select id="type" disabled data-boot-disabled><option value="">全部题型</option></select></label><label>掌握状态<select id="status" disabled data-boot-disabled><option value="">全部状态</option><option value="new">未做</option><option value="learning">待巩固</option><option value="mastered">已掌握</option></select></label><label id="number-label" hidden>原题号<input id="number-search" type="search" inputmode="numeric" placeholder="如 12"></label><button id="clear" disabled data-boot-disabled>清除筛选</button></section><div class="queuebar"><span id="counter"></span><button id="list-toggle" disabled data-boot-disabled aria-expanded="false">题目列表</button></div><div id="question-list" hidden></div><article id="question"></article><section id="record-panel"><div class="record-actions"><label>掌握状态<select id="mastery" disabled data-boot-disabled><option value="new">未做</option><option value="learning">待巩固</option><option value="mastered">已掌握</option></select></label><button id="favorite" disabled data-boot-disabled aria-pressed="false">☆ 收藏</button><button id="wrong" disabled data-boot-disabled aria-pressed="false">标记错题</button></div><label for="note" class="note-label">解题笔记 <span id="save-status" role="status" aria-live="polite">尚无学习记录</span></label><textarea id="note" disabled data-boot-disabled rows="4" placeholder="记下思路、卡点或下次要注意的地方……"></textarea><div id="save-recovery" hidden><button id="retry">重试保存</button><button id="copy-note">复制当前草稿</button><button id="reload-record">保留草稿并载入最新记录</button></div><div id="conflicts"></div></section><div class="navigation"><button id="prev" disabled data-boot-disabled>← 上一题</button><span>在纸上作答，再对照解析</span><button id="next" disabled data-boot-disabled class="primary">下一题 →</button></div><p id="global-error" role="alert"></p></main>
<dialog id="backup-dialog"><div class="dialog-head"><h2>备份与恢复</h2><button id="close-backup" aria-label="关闭">×</button></div><p>换电脑、换浏览器或清理站点数据前，请导出学习记录。</p><button id="export" class="primary">导出全部学习记录</button><p id="last-export"></p><hr><label>选择备份文件<input id="import-file" type="file" accept=".json,application/json"></label><div id="import-preview" role="status"></div><div id="import-actions" hidden><p>合并会保留不同版本的笔记。替换会清除当前记录并恢复备份中的全部记录；先下载当前备份。</p><button id="merge">合并记录</button><button id="pre-replace">下载替换前备份</button><button id="replace" disabled>替换全部记录</button></div><p id="backup-error" role="alert"></p></dialog>
<dialog id="image-dialog"><button id="close-image">关闭图片</button><button id="zoom-in">放大＋</button><button id="zoom-out">缩小－</button><button id="zoom-reset">适应屏幕</button><div id="image-stage"><img id="large-image" alt="题目配图放大"></div></dialog><dialog id="login-dialog"><h2>登录数二练习本</h2><p>使用已登记的邮箱接收验证码。</p><label>邮箱<input id="login-email" type="email" autocomplete="email"></label><button id="send-code">获取验证码</button><label>验证码<input id="login-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label><button id="login-submit" class="primary">登录</button><button id="login-cancel">取消</button><p id="login-message" role="status"></p></dialog><dialog id="stale-dialog"><h2>云端已恢复备份</h2><p>本设备旧版本的修改已暂存，没有上传。请先保存导出的本地备份，再载入云端版本；之后可导入备份并预览合并。</p><button id="adopt-cloud">导出本地备份并载入云端</button><form method="dialog"><button>暂不处理，继续本地练习</button></form></dialog></body></html>
